<!doctype html><html><head><meta charset="utf-8"><title>Corrected orbit view</title><script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/theme.css"><style>body{margin:0;background:#07121d}#scene{position:absolute;inset:0}header{position:absolute;top:24px;left:24px;z-index:2}aside{position:absolute;right:5%;top:20%;width:240px;padding:24px;background:#102431e8;border:1px solid #2b495b;border-radius:20px}button{margin:4px}h1{font-size:22px}</style></head><body><div id="scene"></div><header>Orbit operations · visual check</header><aside><h1>Flood watch</h1><p>Sun-synchronous orbit</p><p>Actual spacecraft bus and solar wings</p><button class="btn" id="motion">Start orbit</button><button class="btn" id="effect">Antenna signal</button></aside><script type="module">import{loadData}from'../js/data.js';import{createOrbitOps}from'../js/three/orbitOps.js';const data=await loadData();const design={busId:'bus_micro',panelIds:['panel_m'],batteryIds:['battery_s'],fuelIds:['fuel_s'],instrumentIds:['optical_camera'],commsId:'comms_x_band',computerId:'computer_basic',pointingId:'pointing_reaction_wheels',orbitId:'sso'};const view=createOrbitOps(document.querySelector('#scene'),{orbitId:'sso',design,data});view.setProgress(.04);let timer;document.querySelector('#motion').onclick=()=>{if(timer){clearInterval(timer);timer=null;return;}let p=.04;timer=setInterval(()=>view.setProgress(p+=.001),200);};document.querySelector('#effect').onclick=()=>view.flash('antenna');window.addEventListener('pagehide',()=>{clearInterval(timer);view.destroy();});</script></body></html>
