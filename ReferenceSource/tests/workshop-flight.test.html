<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/workshop.css"><script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script></head><body><div id="app"></div><pre id="result">Running custom workshop flight</pre><script type="module">
import {loadData} from '../js/data.js';import {loadCharacters} from '../js/characters.js';import {initRouter,showScreen} from '../js/ui/router.js';import {resetState,setDesign,getState} from '../js/state.js';import {starterDesign} from '../js/campaign.js';import {createLibrary} from '../js/workshop/library.js';import {makeBlueprint,migrateAssembly} from '../js/workshop/blueprint.js';import {getSimulationResults,clearSimulationResults} from '../js/ui/simulation.js';import {stepOperations,resolveIncident,operationSummary,INCIDENTS} from '../js/engine/operations.js';import {readEconomy} from '../js/workshop/economy.js';import {setFlightSession} from '../js/flightSession.js';
const backup=new Map(['space_mission_game_state_v1','orbital_economy_v1','orbital_workshop_draft_v1','orbital_blueprints_v1'].map(k=>[k,localStorage.getItem(k)]));const result=document.querySelector('#result'),wait=ms=>new Promise(r=>setTimeout(r,ms));let assertions=0;function check(v,message){if(!v)throw Error(message);assertions++;}async function until(fn){for(let i=0;i<1200;i++){if(fn())return;await wait(100);}throw Error('Flight UI timed out');}
try{
const data=await loadData();await loadCharacters();resetState();localStorage.removeItem('orbital_economy_v1');data.launchers.find(l=>l.id==='kestrel').reliability=1; // deterministic visual/continuity fixture; launch probability is tested separately
const mission=data.missions.find(m=>m.id==='m1'),design=starterDesign(mission,data,'easy');design.assembly=migrateAssembly(design,data);const wings=design.assembly.components.filter(c=>c.catalogId.startsWith('panel_'));wings[0].attachmentSurfaceId='front';wings[0].localPosition=[0,.45,0];wings[1].attachmentSurfaceId='back';wings[1].localPosition=[0,.45,0];setDesign(design);const reviewed=JSON.stringify(design.assembly);
result.textContent='Running: saved workshop';const library=createLibrary(data),blueprint=makeBlueprint(design,data,'Front and rear continuity satellite');library.save(blueprint);library.draft(blueprint);initRouter(document.querySelector('#app'),data);showScreen('workshop',{mission:true});check(!document.querySelector('#ws-review').disabled,'Saved custom blueprint is ready in workshop');await wait(150);document.querySelector('#ws-review').click();check(document.querySelector('.all-clear'),'Custom arrangement passes advisory');result.textContent='Running: review';await wait(150);document.querySelector('#next').click();check(document.querySelector('[data-screen=review]'),'Review screen reached');check(document.querySelector('[data-screen=review] canvas'),'Actual assembly preview exists in review');result.textContent='Running: launch';await wait(150);document.querySelector('#launch').click();check(document.querySelector('[data-screen=simulation]'),'Launch UI reached');await wait(750);if(new URLSearchParams(location.search).has('continuous')){result.textContent='Running: uninterrupted ascent and deployment';}else{result.textContent='Running: skip to operations';document.querySelector('#skip').click();}await until(()=>document.querySelector('#ops-canvas'));const run=getSimulationResults();check(JSON.stringify(run.design.assembly)===reviewed,'Reviewed arrangement survives launch and operations');check(typeof run.runId==='string','Run has unique reward identity');check(run.operations.hardware.panelW===run.evalResult.panelPower,'Forecast and operations use identical wing power');
result.textContent='Running: deployment completed, operations active';await wait(500);result.textContent='Running: complete fixed-step operations';for(let step=0;step<150&&!run.operations.finished;step++){if(run.operations.pendingIncident)resolveIncident(run.operations,INCIDENTS[run.operations.pendingIncident.id].choices[0].id);stepOperations(run.operations);}check(run.operations.finished,'Operations advanced to completion: '+JSON.stringify({tick:run.operations.tick,paused:run.operations.paused,incident:run.operations.pendingIncident}));result.textContent='Running: report';run.operationsSummary=operationSummary(run.operations);run.phase='report';setFlightSession(run);showScreen('report');await until(()=>Boolean(document.querySelector('.wallet-reward')));check(readEconomy().coins===100,'First actual report pays 100 coins');check(getState().completedMissions.m1,'Authoritative completion unlocks progression');showScreen('report');await until(()=>Boolean(document.querySelector('.wallet-reward')));check(readEconomy().coins===100,'Report reopening does not pay twice');check(JSON.stringify(getSimulationResults().design.assembly)===reviewed,'Report preserves the exact flight assembly');const firstRunId=run.runId;document.querySelector('#btn-report-retry').click();await wait(200);document.querySelector('#ws-review').click();document.querySelector('#next').click();document.querySelector('#launch').click();await wait(150);document.querySelector('#skip').click();await until(()=>document.querySelector('#ops-canvas'));const replay=getSimulationResults();check(replay.runId!==firstRunId,'Legitimate replay starts with a new run identity');for(let step=0;step<150&&!replay.operations.finished;step++){if(replay.operations.pendingIncident)resolveIncident(replay.operations,INCIDENTS[replay.operations.pendingIncident.id].choices[0].id);stepOperations(replay.operations);}replay.operationsSummary=operationSummary(replay.operations);replay.phase='report';setFlightSession(replay);showScreen('report');await until(()=>Boolean(document.querySelector('.wallet-reward')));check(readEconomy().coins===125,'New successful replay earns exactly 25 coins');showScreen('report');await until(()=>Boolean(document.querySelector('.wallet-reward')));check(readEconomy().coins===125,'Replay reward cannot be claimed twice');result.textContent='PASS: '+assertions+' custom-flight UI and reward assertions';
}catch(error){result.textContent='FAIL: '+error.stack;}
finally{clearSimulationResults();for(const [key,value]of backup)if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);}
</script></body></html>
