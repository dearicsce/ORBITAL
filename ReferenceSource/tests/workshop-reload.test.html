<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#08131d;color:white}iframe{width:100vw;height:100vh;border:0}#result{position:fixed;bottom:0;left:0;background:#102733;color:white;font:12px monospace;padding:5px;z-index:999}</style></head><body><iframe id="game" title="Actual ORBITAL application"></iframe><pre id="result">Running real page reload check</pre><script type="module">
import {loadData} from '../js/data.js';import {getState,resetState,setDesign,saveProgress} from '../js/state.js';import {starterDesign} from '../js/campaign.js';import {makeBlueprint} from '../js/workshop/blueprint.js';import {createLibrary,LIBRARY_KEY,DRAFT_KEY} from '../js/workshop/library.js';
const phaseKey='orbital-reload-check',backupKey='orbital-reload-backup',result=document.querySelector('#result'),wait=ms=>new Promise(r=>setTimeout(r,ms));let count=0;const check=(v,m)=>{if(!v)throw Error(m);count++;};
try{const data=await loadData(),library=createLibrary(data);if(!sessionStorage.getItem(phaseKey)){
 sessionStorage.setItem(backupKey,JSON.stringify([LIBRARY_KEY,DRAFT_KEY,'space_mission_game_state_v1'].map(k=>[k,localStorage.getItem(k)])));localStorage.removeItem(LIBRARY_KEY);localStorage.removeItem(DRAFT_KEY);resetState();setDesign(starterDesign(data.missions.find(m=>m.id==='m1'),data));saveProgress();let b=makeBlueprint(getState().currentDesign,data,'Reloaded custom satellite');const wings=b.assembly.components.filter(c=>c.catalogId==='panel_m');wings[0].attachmentSurfaceId='front';wings[1].attachmentSurfaceId='back';wings[0].localPosition=[.2,.45,0];wings[1].localPosition=[-.2,.45,0];b=library.save(b);library.draft(b);sessionStorage.setItem(phaseKey,JSON.stringify(b));location.reload();
}else{const expected=JSON.parse(sessionStorage.getItem(phaseKey));check(performance.getEntriesByType('navigation')[0].type==='reload','A real browser reload occurred');check(JSON.stringify(library.list().find(b=>b.id===expected.id))===JSON.stringify(expected),'Named blueprint survives reload exactly');check(JSON.stringify(library.recover())===JSON.stringify(expected),'Working draft survives reload exactly');const frame=document.querySelector('#game');frame.src='../index.html';let doc;for(let i=0;i<120;i++){doc=frame.contentDocument;if(doc?.querySelector('[data-screen=menu]'))break;await wait(100);}check(Boolean(doc?.querySelector('[data-screen=menu]')),'Actual application bootstraps');const entry=[...doc.querySelectorAll('button')].find(b=>b.textContent==='Satellite Workshop');check(Boolean(entry),'Permanent workshop navigation exists');entry.click();for(let i=0;i<120&&!doc.querySelector('[data-screen=workshop]');i++)await wait(100);check(Boolean(doc.querySelector('[data-screen=workshop]')),'Actual navigation enters workshop');check(doc.querySelector('#ws-name').value===expected.name,'Named design recovered by actual application');check(doc.querySelector('#ws-mission').textContent.includes('Free workshop'),'Workshop opens without accepting a mission');check(doc.querySelector('#ws-review').disabled,'Free workshop does not invent a launchable mission');check(doc.documentElement.scrollWidth<=frame.contentWindow.innerWidth,'Actual stylesheet integration has no horizontal clipping');check(JSON.stringify(library.recover().assembly)===JSON.stringify(expected.assembly),'Rendering and navigation preserve exact identities and transforms');result.textContent='PASS: '+count+' real reload / actual application checks';for(const[k,v]of JSON.parse(sessionStorage.getItem(backupKey)))if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);sessionStorage.removeItem(phaseKey);sessionStorage.removeItem(backupKey);}
}catch(error){result.textContent='FAIL: '+error.stack;}
</script></body></html>
