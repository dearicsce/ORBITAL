<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Launch graphics preview</title><script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/theme.css"><style>body{padding:16px}#scene{height:75vh;position:relative}#scene canvas{display:block}header{display:flex;gap:12px;align-items:center}#status{padding:12px}button{min-height:40px}</style></head><body><header><h1>Launch graphics</h1><button class="btn" id="falcon">Falcon 9</button><button class="btn" id="atlas">Atlas V</button><button class="btn" id="pad">Pad view</button><button class="btn" id="pause">Pause</button></header><div id="status">Choose a rocket</div><div id="scene"></div><script type="module">
import {createLaunchScene} from '../js/three/launchScene.js';import {loadData} from '../js/data.js';const data=await loadData();let view;const host=document.querySelector('#scene'),status=document.querySelector('#status');const base={missionId:'m1',difficulty:'normal',busId:'bus_micro',panelIds:['panel_m'],batteryIds:['battery_s'],fuelIds:['fuel_s'],instrumentIds:['optical_camera'],commsId:'comms_x_band',computerId:'computer_basic',pointingId:'pointing_reaction_wheels',orbitId:'sso'};
function start(launcherId,pad=false){view?.destroy();status.textContent='Loading '+data.launchers.find(l=>l.id===launcherId).name+'…';view=createLaunchScene(host,{launcherId,launchResult:{success:true},data,design:{...base,launcherId},onPhase:text=>status.textContent=text,onDone:()=>status.textContent='Orbit acquired · Replay with either rocket'});if(pad)view.togglePause();}
document.querySelector('#falcon').onclick=()=>start('kestrel');document.querySelector('#atlas').onclick=()=>start('condor');document.querySelector('#pad').onclick=()=>start('kestrel',true);document.querySelector('#pause').onclick=()=>view?.togglePause();window.addEventListener('pagehide',()=>view?.destroy());
</script></body></html>
