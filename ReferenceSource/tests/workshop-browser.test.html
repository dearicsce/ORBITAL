<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css" /><link rel="stylesheet" href="../css/theme.css" /><link rel="stylesheet" href="../css/builder.css" /><link rel="stylesheet" href="../css/guide.css" /><link rel="stylesheet" href="../css/layout-fixes.css" /><link rel="stylesheet" href="../css/graphics.css" /><link rel="stylesheet" href="../css/orbital.css" /><link rel="stylesheet" href="../css/mission-control.css" /><link rel="stylesheet" href="../css/evidence.css" /><link rel="stylesheet" href="../css/historical-context.css" /><link rel="stylesheet" href="../css/workshop.css" /><script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script></head><body style="margin:0"><div id="app"></div><pre id="result">Running workshop browser checks</pre><script type="module">
import {loadData} from '../js/data.js';
import {initRouter,showScreen} from '../js/ui/router.js';
import {setDesign,resetState,getState,importProgress} from '../js/state.js';
import {starterDesign} from '../js/campaign.js';

import {readEconomy} from '../js/workshop/economy.js';
const result=document.querySelector('#result');let count=0;const check=(ok,label)=>{if(!ok)throw Error(label);count++;};
const originalLibrary=localStorage.getItem(LIBRARY_KEY),originalDraft=localStorage.getItem(DRAFT_KEY),progress=localStorage.getItem('space_mission_game_state_v1'),wallet=localStorage.getItem('orbital_economy_v1');
const tick=()=>new Promise(resolve=>setTimeout(resolve,100));const until=async predicate=>{for(let i=0;i<60;i++){if(predicate())return;await tick();}throw Error('Asynchronous workshop action timed out');};
try{
 const data=await loadData();resetState();localStorage.removeItem(LIBRARY_KEY);localStorage.removeItem(DRAFT_KEY);
 setDesign(starterDesign(data.missions.find(m=>m.id==='m1'),data));initRouter(document.querySelector('#app'),data);showScreen('workshop',{mission:true});await tick();
 const click=q=>{const e=document.querySelector(q);if(!e)throw Error('Missing '+q);e.click();};
 const change=(q,value)=>{const e=document.querySelector(q);e.value=value;e.dispatchEvent(new Event('change',{bubbles:true}));};
 check(document.querySelector('canvas'),'Actual 3D canvas mounted');check(document.querySelector('#ws-mission').textContent.includes('Difficulty:'),'Difficulty labelled separately');
 click('[data-select]');check(!document.querySelector('[data-tool="remove"]'),'Bus cannot be removed as equipment');
 let library=createLibrary(data);const wings=library.recover()?.assembly.components.filter(c=>c.catalogId.startsWith('panel_'))||[];
 // Draft is first written by a user action.
 change('#ws-name','Browser acceptance satellite');const draft=library.recover();const ids=draft.assembly.components.filter(c=>c.catalogId.startsWith('panel_')).map(c=>c.instanceId);
 click(`[data-select="${ids[0]}"]`);change('#ws-face','front');change('[data-coordinate="1"]',.45);click(`[data-select="${ids[1]}"]`);change('#ws-face','back');change('[data-coordinate="1"]',.45);
 click('#ws-save');check(document.querySelector('#ws-status').textContent==='Saved','Save confirmation follows persistence');const first=library.list()[0];check(first.assembly.components.find(c=>c.instanceId===ids[0]).attachmentSurfaceId==='front','First wing moved front');check(first.assembly.components.find(c=>c.instanceId===ids[1]).attachmentSurfaceId==='back','Other wing moved independently');
 click('#ws-save-as');check(library.list().length===2,'Save As creates separate named blueprint');check(library.list()[0].id!==library.list()[1].id,'Save As unique identity');
 click('#ws-library');check(document.querySelector('.ws-library-list').textContent.includes('Wh usable'),'Library exposes engineering summary');click(`[data-library-duplicate="${first.id}"]`);check(library.list().length===3,'Library duplicate creates a named blueprint');const duplicateEntry=library.list().find(b=>b.name.endsWith(' copy'));check(duplicateEntry.assembly.components.every(c=>!first.assembly.components.some(v=>v.instanceId===c.instanceId)),'Library duplicate has independent component identities');click('[data-choice="0"]');
 click('[data-tool="mirror"]');check(document.querySelector('[role=dialog]').textContent.includes('Preview linked mirror'),'Mirror preview precedes commit');click('[data-choice="1"]');check(library.recover().assembly.components.length===first.assembly.components.length,'Cancelling mirror adds nothing');click('[data-tool="mirror"]');click('[data-choice="0"]');change('[data-coordinate="0"]',.1);const pair=library.recover().assembly.components.filter(c=>c.symmetryId);check(pair.length===2&&pair[0].localPosition[0]===-pair[1].localPosition[0],'Linked mirror edits both placements');click('[data-tool="mirror"]');check(!library.recover().assembly.components.some(c=>c.symmetryId),'Unlink preserves independent placements');click('#ws-undo');click('#ws-undo');click('#ws-undo');check(library.recover().assembly.components.length===first.assembly.components.length,'Mirror workflow fully undoable');
 click('[data-tool="duplicate"]');check(document.querySelector('#ws-selected').textContent.includes('needs-placement'),'Duplicate awaits placement');const quantity=library.recover().assembly.components.length;click('#ws-undo');check(library.recover().assembly.components.length===quantity-1,'Duplicate undo');click('#ws-redo');check(library.recover().assembly.components.length===quantity,'Duplicate redo');
 click('#ws-interior');check(document.querySelector('#ws-interior').checked,'Cutaway toggle');click(`[data-select="${first.assembly.components.find(c=>c.catalogId==='battery_m').instanceId}"]`);click('[data-tool="move"]');check(document.activeElement.id==='ws-bay','Internal Move focuses precise bay placement');check(document.querySelector('[data-tool="rotate"]').disabled,'Fixed internal orientation is explicit');click('#ws-stowed');check(document.querySelector('#ws-stowed').checked,'Stowed toggle');click('#ws-surfaces');
 const name=document.querySelector('#ws-name');name.focus();name.dispatchEvent(new KeyboardEvent('keydown',{key:'Delete',bubbles:true}));check(library.recover().assembly.components.length===quantity,'Typing Delete does not remove equipment');
 const before=library.recover().assembly;showScreen('workshop',{mission:true});await tick();check(JSON.stringify(library.recover().assembly)===JSON.stringify(before),'Editor remount recovers exact draft');
 click('#ws-library');click(`[data-load="${first.id}"]`);check(document.querySelector('[role=dialog]').textContent.includes('Unsaved changes'),'Loading a different design guards named changes');click('[data-choice="2"]');check(JSON.stringify(library.recover().assembly)===JSON.stringify(before),'Cancel retains working arrangement');
 const nativeSetItem=Storage.prototype.setItem;try{Storage.prototype.setItem=function(key,value){if(key===LIBRARY_KEY)throw new DOMException('Full storage','QuotaExceededError');return nativeSetItem.call(this,key,value);};click('#ws-save');check(document.querySelector('#ws-status').textContent==='Save error','Real UI does not report Saved after quota failure');}finally{Storage.prototype.setItem=nativeSetItem;}
 const nativeImage=HTMLCanvasElement.prototype.toDataURL;try{HTMLCanvasElement.prototype.toDataURL=()=>{throw Error('Thumbnail failed');};click('#ws-save');check(document.querySelector('#ws-status').textContent==='Saved','Thumbnail failure does not prevent saving spacecraft data');}finally{HTMLCanvasElement.prototype.toDataURL=nativeImage;}
 document.querySelector('#ws-search').value='battery';document.querySelector('#ws-search').dispatchEvent(new Event('input'));check([...document.querySelectorAll('.ws-card')].every(c=>c.querySelector('[data-preview]')?.dataset.preview.startsWith('battery_')),'Catalogue search filters');
 const compare=[...document.querySelectorAll('[data-compare]')];compare[0].click();compare[1].click();click('#ws-compare');check(document.querySelectorAll('.ws-modal table th').length>3,'Comparison exposes parallel engineering specifications');click('[data-choice="0"]');
 localStorage.setItem('orbital_economy_v1',JSON.stringify({schemaVersion:1,coins:500,unlocked:[],claims:{}}));showScreen('workshop',{mission:true});await tick();const purchase=document.querySelector('[data-buy="panel_film"]');purchase.click();purchase.click();for(let i=0;i<40&&readEconomy().coins===500;i++)await tick();check(readEconomy().coins===320&&readEconomy().unlocked.includes('panel_film'),'Native unlock click spends once under real Web Locks: '+readEconomy().coins+' / '+document.querySelector('#ws-notice').textContent);showScreen('workshop',{mission:true});await tick();check(document.querySelector('[data-add="panel_film"]'),'Purchased access survives editor reload');
 click('[data-preview="computer_observatory"]');check(document.querySelector('#ws-equipment-preview canvas'),'Locked equipment has an inspectable model');check(readEconomy().coins===320,'Preview spends no coins');click('[data-choice="0"]');
 const imported=structuredClone(first);imported.assembly.components[0].catalogId='unknown-instrument-definition';click('#ws-library');const transfer=new DataTransfer();transfer.items.add(new File([JSON.stringify(imported)],'unknown-blueprint.json',{type:'application/json'}));document.querySelector('#ws-import').files=transfer.files;document.querySelector('#ws-import').dispatchEvent(new Event('change'));await until(()=>document.querySelector('[role=dialog]')?.textContent.includes('Unsaved changes')||document.querySelector('#ws-readiness')?.textContent.includes('Unknown catalogue'));if(document.querySelector('[role=dialog]')?.textContent.includes('Unsaved changes'))click('[data-choice="1"]');await until(()=>document.querySelector('#ws-readiness').textContent.includes('Unknown catalogue'));check(document.querySelector('#ws-readiness').textContent.includes('Unknown catalogue'),'Unknown import remains explicitly unresolved');check(document.querySelector('#ws-review').disabled,'Unknown import cannot launch');click(`[data-select="${imported.assembly.components[0].instanceId}"]`);check(document.querySelector('#ws-selected').textContent.includes('Unresolved catalogue'),'Unknown component remains inspectable');
 const locked=structuredClone(first);locked.assembly.components[0].catalogId='battery_deep';click('#ws-library');const lockedFile=new DataTransfer();lockedFile.items.add(new File([JSON.stringify(locked)],'locked.json'));document.querySelector('#ws-import').files=lockedFile.files;document.querySelector('#ws-import').dispatchEvent(new Event('change'));await until(()=>document.querySelector('[role=dialog]')?.textContent.includes('Unsaved changes')||document.querySelector('#ws-readiness')?.textContent.includes('locked'));if(document.querySelector('[role=dialog]')?.textContent.includes('Unsaved changes'))click('[data-choice="1"]');await until(()=>document.querySelector('#ws-readiness').textContent.includes('locked'));check(document.querySelector('#ws-readiness').textContent.includes('locked')&&document.querySelector('#ws-review').disabled,'Locked imported equipment cannot bypass launch access');check(readEconomy().coins===320,'Import does not spend progression coins');
 const beforeMalformed=JSON.stringify(library.recover());click('#ws-library');const malformed=new DataTransfer();malformed.items.add(new File(['{bad json'],'malformed.json'));document.querySelector('#ws-import').files=malformed.files;document.querySelector('#ws-import').dispatchEvent(new Event('change'));await until(()=>document.querySelector('#ws-import-error'));check(document.querySelector('#ws-import-error')?.textContent.includes('Import failed'),'Malformed import error is visible inside its modal');check(JSON.stringify(library.recover())===beforeMalformed,'Malformed import leaves draft intact');click('[data-choice="0"]');
 const priorState=getState();check(importProgress({...priorState,completedMissions:{m1:{stars:4},m2:{stars:4},m3:{stars:4}}},data).ok,'Legacy earned access fixture loads');showScreen('menu');const large=structuredClone(first);large.id='replacement-probe';large.assembly.busId='bus_large';large.assembly.components.push({instanceId:'replacement-battery',catalogId:'battery_s',parentInstanceId:'bus',attachmentSurfaceId:null,bayId:'bay-20',localPosition:[0,0,0],localRotation:[0,0,0],configuration:{},placementStatus:'placed'});localStorage.setItem(DRAFT_KEY,JSON.stringify(large));showScreen('workshop',{mission:true});click('[data-add="bus_micro"]');check(document.querySelector('[role=dialog]').textContent.includes('exceeds the internal bay'),'Smaller-bus preview identifies incompatible equipment');click('[data-choice="0"]');check(library.recover().assembly.components.find(c=>c.instanceId==='replacement-battery').placementStatus==='needs-placement','Bus replacement retains incompatible identity in Needs placement');click('#ws-undo');check(library.recover().assembly.busId==='bus_large'&&library.recover().assembly.components.find(c=>c.instanceId==='replacement-battery').bayId==='bay-20','Undo restores bus and exact equipment bay');importProgress(priorState,data);
 const storageDescriptor=Object.getOwnPropertyDescriptor(window,'localStorage');try{Object.defineProperty(window,'localStorage',{configurable:true,get(){throw new DOMException('Unavailable storage','SecurityError');}});showScreen('workshop',{mission:true});change('#ws-name','Storage unavailable working copy');check(document.querySelector('#ws-name').value==='Storage unavailable working copy','Editor remains usable when storage is unavailable');click('#ws-save');check(document.querySelector('#ws-status').textContent==='Save error','Unavailable storage produces accurate Save error');}finally{Object.defineProperty(window,'localStorage',storageDescriptor);}
 check(document.documentElement.scrollWidth<=innerWidth,'No horizontal page clipping');
 const passSummary='PASS: '+count+' actual Chromium workshop checks';
 const params=new URLSearchParams(location.search);if(params.has('evidence')){showScreen('menu');localStorage.setItem(DRAFT_KEY,JSON.stringify(first));showScreen('workshop',{mission:true});await tick();click(`[data-select="${ids[0]}"]`);}
 if(params.has('bus')){document.querySelector('#ws-search').value='';document.querySelector('#ws-search').dispatchEvent(new Event('input'));const button=document.querySelector(`[data-add="${params.get('bus')}"]`);if(button){button.click();document.querySelector('[data-choice="0"]')?.click();}}
result.textContent=passSummary;
}catch(error){result.textContent='FAIL: '+error.stack;}
finally{for(const [key,value]of [[LIBRARY_KEY,originalLibrary],[DRAFT_KEY,originalDraft],['space_mission_game_state_v1',progress],['orbital_economy_v1',wallet]])if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);}
</script></body></html>
